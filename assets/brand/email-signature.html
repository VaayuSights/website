  VaayuSights email signature

  paste into Gmail Settings > Signature (or Outlook > New Signature). Pasting
  the rendered block keeps the formatting; do not paste this file's code.

  Replace [ YOUR NAME ], [ Role ] and [ +91 00000 00000 ] before using.

  The logo loads from vaayusights.in, so it appears once the site is live.
  Until then the signature still reads correctly - the image simply shows as
  a blank space or alt text. Keep the image hosted rather than embedded:
  most mail clients strip embedded images as suspicious.

  Fonts are web-safe on purpose. Mail clients do not load custom fonts, so
  Orbitron would silently fall back and look inconsistent.
-->
