<!--
  VaayuSights email signature
  ---------------------------
  How to use: open this file in a browser, select the whole rendered block,
  copy, then paste into your mail client's signature editor. Paste the
  RENDERED block, not this file's code — unless the editor offers an HTML
  source view, in which case paste the markup below directly, which is more
  reliable.

  Replace [ +91 00000 00000 ] with the real number, or delete that line
  entirely until the number exists. A signature with a placeholder number in
  it is worse than one with no number at all.

  NO PERSONAL NAME. This is deliberate and it matches the rule in
  outreach.md: sign as VaayuSights. An earlier version of this file carried
  a [ YOUR NAME ] placeholder, which contradicted that rule and would have
  put the owner's name in front of every cold prospect. If a client later
  needs a named signatory on a contract, that is a document, not a signature
  block.

  The logo loads from vaayusights.in rather than being embedded, because most
  mail clients strip embedded images as suspicious.

  WHY THE EMBLEM SITS ON A DARK PANEL. The colour emblem is built to glow
  against dark. On white its lower tail strokes lose the glow, the dark
  outlines dominate, and it reads as a grey smudge — the legibility failure
  README.md line 23 describes. The README's own remedy is to put the colour
  logo inside a dark panel on a light page, which is what the first cell does.
  It also means the emblem looks identical whether the reader is in light mode
  or dark mode.

  WHY THE TABLE SETS AN EXPLICIT WHITE BACKGROUND. Without it, aggressive
  dark-mode clients (Apple Mail, some Outlook builds) invert the block and the
  near-black name and contact lines vanish against the new dark ground. An
  explicit bgcolor is honoured by most clients and keeps the signature
  readable. It is not bulletproof — no email signature is — but it fails far
  less often than leaving the background undefined.

  Fonts are web-safe on purpose. Mail clients do not load custom fonts, so
  Orbitron would silently fall back and look inconsistent.
-->
